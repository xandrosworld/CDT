<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thành Đạt Phát · Hệ thống vận hành</title>
  <link rel="stylesheet" href="/shared/styles.css">
  <link rel="stylesheet" href="/static/real.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">TĐP</div>
        <div><strong>THÀNH ĐẠT PHÁT</strong><span>Hệ thống vận hành</span></div>
      </div>
      <nav id="nav">
        <button class="nav-item active" data-view="home"><span>⌂</span> Tổng quan</button>
        <button class="nav-item" data-view="orders"><span>▤</span> Nhập & kiểm tra đơn</button>
        <button class="nav-item" data-view="purchases"><span>⇄</span> Đặt hàng NCC</button>
        <button class="nav-item" data-view="deliveries"><span>▣</span> Phiếu giao</button>
        <button class="nav-item" data-view="quotes"><span>₫</span> Báo giá</button>
        <button class="nav-item" data-view="reports"><span>↗</span> Báo cáo & công nợ</button>
        <button class="nav-item" data-view="documents"><span>✓</span> Bảng kê & hóa đơn</button>
        <button class="nav-item" data-view="settings"><span>⚙</span> Danh mục & sao lưu</button>
      </nav>
      <div class="sidebar-foot">
        <div class="online-dot"></div>
        <div><strong>Đang lưu dữ liệu</strong><span>SQLite · dùng chung mạng LAN</span></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-button" id="menuButton" aria-label="Mở menu">☰</button>
        <div><p class="eyebrow">BẢN VẬN HÀNH THẬT</p><h1 id="pageTitle">Tổng quan hôm nay</h1></div>
        <div class="top-actions">
          <select class="select batch-select" id="batchSelect" aria-label="Chọn phiên đơn"></select>
          <button class="user-chip" title="Hai người có thể cùng sử dụng">VT</button>
        </div>
      </header>
      <section class="content" id="content">
        <div class="loading-panel"><div class="spinner"></div><strong>Đang nạp dữ liệu…</strong></div>
      </section>
    </main>
  </div>

  <input type="file" id="excelInput" accept=".xlsx,.xlsm" hidden>
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><div><p class="eyebrow">CẬP NHẬT DỮ LIỆU</p><h2 id="modalTitle">Dòng đơn hàng</h2></div><button class="icon-button" data-action="close-modal">×</button></div>
      <form id="orderForm" class="modal-body"></form>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="/static/app.js"></script>
</body>
</html>
